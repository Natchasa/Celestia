<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow">
    <!-- Same CSP posture as index.html, widened for Firebase. No EmailJS needed here. -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' https://www.gstatic.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data:; connect-src 'self' https://firestore.googleapis.com https://identitytoolkit.googleapis.com https://securetoken.googleapis.com; object-src 'none'; base-uri 'self'; form-action 'none'; frame-ancestors 'none'; upgrade-insecure-requests;">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    <title>Celestia Admin - อนุมัติการลงทะเบียน</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;500;600;700&family=Sarabun:wght@300;400;500;600;700;800&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="styles.css?v=154">
</head>
<body class="admin-body">
    <div class="stars-bg"></div>

    <!-- Login -->
    <div class="admin-login-wrap" id="admin-login-wrap">
        <div class="auth-card">
            <div class="auth-logo">
                <img src="celestia-lockup-header.png?v=113" alt="Celestia" class="auth-logo-img">
            </div>
            <p class="auth-subtitle">เข้าสู่ระบบผู้ดูแล (Admin)</p>
            <form id="admin-login-form" class="auth-form" autocomplete="off">
                <input type="email" class="auth-input" id="admin-email-input" placeholder="อีเมลแอดมิน" autocomplete="username" required style="width:100%; box-sizing:border-box;">
                <input type="password" class="auth-input" id="admin-password-input" placeholder="รหัสผ่าน" autocomplete="current-password" required style="width:100%; box-sizing:border-box;">
                <p class="auth-error" id="admin-login-error" style="display:none;"></p>
                <button type="submit" class="auth-submit-btn" id="admin-login-btn">เข้าสู่ระบบ</button>
            </form>
        </div>
    </div>

    <!-- Dashboard -->
    <div class="admin-container" id="admin-dashboard" style="display:none;">
        <div class="admin-header">
            <h1 class="admin-title">คำขอลงทะเบียน Celestia</h1>
            <button type="button" class="admin-logout-btn" id="admin-logout-btn">ออกจากระบบ</button>
        </div>
        <div id="admin-list-container">
            <p class="admin-empty" id="admin-loading-msg">กำลังโหลดรายการ...</p>
        </div>
    </div>

    <script src="firebase-config.js?v=1"></script>
    <script type="module" src="firebase-init.js?v=1"></script>
    <script src="admin.js?v=1"></script>
</body>
</html>
